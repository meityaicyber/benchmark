# Section 9: engagement module definitions. Each module names the frameworks whose application
# is traced under Q1 and the additional checks assessed under the module checks of Q8 (MD).
# Check implementations live in certin_benchmark/modules.py; keywords used by those checks are here.
# A check listed under several selected modules is assessed once.

baseline_framework: Cyber Security Audit Baseline Requirements   # expected under every module

# Checks added to the table of Section 9 from the CERT-In documents supplied in October 2026, with their
# basis. They are applied pending CERT-In's confirmation, and each row of the record names its basis. To apply
# the table of Section 9 alone, remove them from the modules below (Section 9: module definitions are
# maintained as configuration).
pending_confirmation:
  application_security_guidelines: "CERT-In key recommendations (September 2024) iv (the guidelines document is the one Guidelines §8(vii) names)"
  certificate_artefacts: "CERT-In key recommendations (September 2024) vi; Guidelines §9.5(i), §16.1(v)"
  certificate_environment: "CERT-In key recommendations (September 2024) x (Guidelines §16.3(v) asks the same of the final report, which MC-12 checks)"
  certificate_after_followup: "CERT-In key recommendations (September 2024) x (Guidelines §16.3(v) asks the same of the final report)"
  compliance_baseline_markers: "Cyber Security Audit Baseline Requirements (NSCS-46-16), Tables 2 to 4; Guidelines §8(iii)"

modules:
  web:
    name: Web application
    frameworks: [OWASP WSTG, OWASP ASVS]
    checks: [web_version_hash, web_environment, web_third_party_certificate, application_security_guidelines,
             certificate_artefacts, certificate_environment, certificate_after_followup]
    clauses: ["§8(ii)", "§9.5(i)", "§13.1.5", "§15.2.3(ii)", "§16.1(v)"]
  mobile:
    name: Mobile application
    frameworks: [OWASP MSTG]
    checks: [mobile_version_build_hash, mobile_platform, application_security_guidelines, certificate_artefacts,
             certificate_environment, certificate_after_followup]
    clauses: ["§8(ii)", "§9.5(i)", "§13.2.3(ii)(c)", "§16.1(v)"]
  api:
    name: Application programming interface
    frameworks: [OWASP WSTG, OWASP ASVS]
    checks: [api_role_coverage, application_security_guidelines, certificate_artefacts, certificate_environment,
             certificate_after_followup]
    clauses: ["§8(ii)", "§9.5(i)", "§13.1.1(a)", "§16.1(v)"]
  network:
    name: Network, infrastructure and device
    frameworks: [OSSTMM3, ISO/IEC]
    checks: [network_configuration_evidence, network_default_credentials, network_unused_ports, network_remote_mfa]
    clauses: ["§8(ii)", "§9.6(iii)", "§9.6(v)"]
  cloud:
    name: Cloud
    frameworks: [CSA Cloud Controls Matrix]
    checks: [cloud_architecture_covered]
    clauses: ["§8(ii)", "§13.1.1(a)"]
  cicd:
    name: CI/CD and DevSecOps
    frameworks: [OWASP DevSecOps Maturity Model]
    checks: [cicd_pipeline_stages]
    clauses: ["§8(ii)"]
  source_code:
    name: Source code review
    frameworks: [OWASP ASVS]
    checks: [source_static_tool, source_manual_review, application_security_guidelines]
    clauses: ["§8(i)", "§13.1.3(iii)"]
  compliance:
    name: Compliance, process and policy
    frameworks: [ISO/IEC]
    checks: [compliance_policy_review, compliance_assessments_populated, compliance_baseline_markers]
    clauses: ["§8(iii)", "§8(vi)", "§18(ii)"]
  critical_database:
    name: Critical database
    frameworks: [ISO/IEC, Cyber Security Audit Baseline Requirements]
    checks: [database_category_covered, database_asset_addressed]
    clauses: ["§13.1.3(ii)"]
  forensics:
    name: Digital forensics
    frameworks: []
    checks: [forensics_limitations, forensics_log_recommendations, forensics_threat_actor_removal]
    clauses: ["§18(vi)"]

not_covered_types: [Red Team Assessment, OT/ICS Security Testing, IoT/IIoT Security Testing, AI System Audit, Blockchain Security Audit, SBOM/QBOM/AIBOM Audit]

keywords:
  third_party_certificate_terms: [["vulnerab", "exploit"], ["malicious"], ["database"], ["script"]]   # every group must be matched
  mobile_platforms: ["android", "ios", "iphone", "ipad", "harmonyos", "apk", "ipa"]
  api_roles: ["admin", "administrator", "superadmin", "super admin", "user", "end user", "guest", "anonymous", "unauthenticated", "manager", "operator", "maker", "checker", "approver", "viewer", "editor", "auditor", "supervisor", "agent", "customer", "merchant", "partner", "service account"]
  network_configuration: ["config", "configuration", "running-config", "show run", "startup-config", "acl", "access list", "firewall rule"]
  default_credentials: ["default credential", "default password", "default account", "factory default", "default username"]
  unused_ports: ["unused port", "open port", "unnecessary port", "unnecessary service", "disabled port", "port hardening", "closed port"]
  remote_mfa: ["multi-factor", "multifactor", "mfa", "2fa", "two-factor", "two factor"]
  pipeline_stages: ["source", "commit", "build", "test", "scan", "artifact", "release", "deploy", "deployment", "monitor"]
  sast_tools: ["static analysis", "sast", "sonarqube", "checkmarx", "fortify", "semgrep", "codeql", "veracode", "coverity", "bandit", "spotbugs", "brakeman", "snyk code", "klocwork", "pmd"]
  manual_review_terms: ["manual review", "manual code review", "manually reviewed", "line-by-line", "peer review", "code walkthrough", "manual analysis"]
  forensic_evidence_constraints: ["log", "evidence", "retention", "volatile", "image", "artefact", "artifact", "chain of custody"]
  log_capture: ["log", "logging", "siem", "audit trail", "retention"]
  threat_actor_removal: ["threat actor", "attacker access", "access removed", "access revoked", "eradicat", "persistence removed", "backdoor removed", "credentials rotated", "root cause remediated", "root cause has been remediated"]
