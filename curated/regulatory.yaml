# Regulatory reference lists (Suite MC-06, MC-07, Q2).
# Checked against the issuers' sites on 12 October 2026; each entry names its source.
# STATUS: project lists pending CERT-In confirmation. The 282 control points of the MeitY checklist
# are not published and are to be supplied by CERT-In or MeitY.

directions_2022:
  framework: "CERT-In Directions 28.04.2022"
  source: "https://www.cert-in.org.in/PDF/CERT-In_Directions_70B_28.04.2022.pdf (No. 20(3)/2022-CERT-In)"
  explanatory: "https://www.cert-in.org.in/PDF/FAQs_on_CyberSecurityDirections_May2022.pdf (FAQs, May 2022)"
  source_status: >-
    The six directions below follow the published Directions. The CERT-In document on methods of
    verification cited by the Suite could not be retrieved (its URL returns not found on 12 October 2026);
    the list is to be replaced by that document's enumeration when CERT-In supplies it.
  requirements:
    - id: DIR-i
      text: "Connect to the NTP server of NIC or NPL, or to NTP servers traceable to them, for synchronisation of all ICT system clocks"
    - id: DIR-ii
      text: "Report cyber incidents of the types in Annexure I to CERT-In within 6 hours of noticing them or being notified of them"
    - id: DIR-iii
      text: "Take action or furnish information when ordered by CERT-In, within the time specified, and designate a Point of Contact to interface with CERT-In (Annexure II format)"
    - id: DIR-iv
      text: "Enable logs of all ICT systems and maintain them securely for a rolling period of 180 days within the Indian jurisdiction"
    - id: DIR-v
      text: "Data centres, virtual private server, cloud service and VPN service providers register and maintain subscriber information for 5 years or longer as mandated by law"
    - id: DIR-vi
      text: "Virtual asset service, exchange and custodian wallet providers maintain KYC and records of financial transactions for 5 years"

meity_checklist:
  framework: "MeitY Comprehensive Audit Program Checklist"
  source_status: "Not publicly available; the figure of 282 control points is from Guidelines §8(v). To be supplied by CERT-In or MeitY."
  control_points: []          # MC-07 counts distinct assessed identifiers until the list is supplied

