[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "certin-benchmark"
version = "1.0.0"
description = "Objective 3: Cybersecurity Audit Report Benchmarking Suite (CERT-In CIGU-2025-0002)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "DTU MeitY/CERT-In project team" }]
dependencies = [
    "PyYAML>=6.0",
    "cvss>=3.2",
    "cryptography>=41",
    # proof-of-concept images other than JPEG and PNG (JPEG 2000, TIFF and others, as Objective 1 stores them) are
    # converted to PNG before they are sent to the vision model
    "Pillow>=10",
]

[project.optional-dependencies]
# preparation host only: conversion of CERT-In's PDF list of empanelled organisations and of its register of their
# identifiers and validity (spreadsheet)
preparation = ["pdfplumber>=0.10", "openpyxl>=3.1"]
# analyses over many evaluation records (certin-benchmark analytics): peer baselines, anomalies, trends, prediction
analytics = ["numpy>=1.24"]

[project.scripts]
certin-benchmark = "certin_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
certin_benchmark = ["py.typed", "refdata/schema.sql", "data/*.json"]
